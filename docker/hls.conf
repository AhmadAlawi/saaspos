# Live camera streaming (beta) — HlsStreamManager writes playlists +
# segments to storage/app/public/hls/, served here as plain static
# files (never through PHP). Two things the base image's default
# mime.types doesn't reliably cover, both needed for Safari's native
# HLS playback and for hls.js to not choke on a stale/cached manifest:
#   - the correct Content-Type per Apple's HLS spec
#   - no caching on the playlist (it's rewritten every ~2s while a
#     stream is live; segments themselves are fine to cache briefly
#     since they're immutable once written)
location ~* \.m3u8$ {
    types { application/vnd.apple.mpegurl m3u8; }
    default_type application/vnd.apple.mpegurl;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Access-Control-Allow-Origin "*";
}

location ~* \.ts$ {
    types { video/mp2t ts; }
    default_type video/mp2t;
    add_header Cache-Control "public, max-age=10";
    add_header Access-Control-Allow-Origin "*";
}
