# Explicit gzip config rather than trusting the base image's undocumented
# defaults (same reasoning as this Dockerfile's other vhost.common.d
# additions) — this is the single biggest lever for a slow/metered
# terminal connection: the cashier's full-page HTML (300KB+ inline
# catalog seed) and every /cashier/sync JSON page compress ~70-80%
# with plain text compression, so this alone meaningfully shrinks what
# a slow link actually has to pull, no app-code changes required.
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 512;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    font/woff
    font/woff2
    image/svg+xml;
